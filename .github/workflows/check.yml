name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Built apps in headless Chromium: the browser host, with a backend that answers slowly.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser

  # Every difference from Rebol 3 is a decision (test/r3-differences.json), never an accident.
  r3check:
    runs-on: ubuntu-latest
    env:
      R3_VERSION: 3.22.1
      R3: ${{ github.workspace }}/.r3/rebol3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Rebol 3 (Oldes)
        run: |
          mkdir -p .r3
          curl -fsSL "https://github.com/Oldes/Rebol3/releases/download/$R3_VERSION/rebol3-bulk-linux-x64.gz" | gunzip > "$R3"
          chmod +x "$R3"
          "$R3" -v
      - run: npm run r3check
